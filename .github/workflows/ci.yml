name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    name: 轻量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JS 语法检查
        run: node --check js/app.js

      - name: 检查入口文件存在
        run: |
          set -e
          for f in index.html css/style.css js/app.js sw.js manifest.webmanifest; do
            if [ ! -f "$f" ]; then
              echo "缺少文件: $f"
              exit 1
            fi
          done
          echo "入口文件齐全"

      - name: 检查 manifest 是合法 JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Python 语法检查
        run: python -m py_compile server/server.py

      - name: Python 接口测试（不依赖真模型）
        run: python -m unittest discover -s server -v

      - name: 检查文档链接目标存在
        run: |
          set -e
          for f in README.md LICENSE docs/ARCHITECTURE.md docs/ANDROID.md; do
            if [ ! -f "$f" ]; then
              echo "缺少文件: $f"
              exit 1
            fi
          done
          echo "文档齐全"
